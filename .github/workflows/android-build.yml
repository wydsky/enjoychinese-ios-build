name: Android Release Build & Google Play Upload

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: true
        default: 'Bug fixes and performance improvements'
      track:
        description: 'Google Play track to upload to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build Android APK & Upload to Google Play
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Pull private Gitee Flutter code
        run: |
          git clone -b client-release https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/yunhaninfo/enjoy-chinese.git source-code
          cd source-code

      - name: 🔢 Manage Android Build Version
        working-directory: ./source-code
        run: |
          set -e
          echo "========================================"
          echo "🔢 Managing Android Build Version"
          echo "========================================"
          
          # Read current version from pubspec.yaml
          CURRENT_VERSION=$(grep "^version:" enjoychinese_app/pubspec.yaml | sed 's/version: *//' | tr -d ' ')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d+ -f2)
          echo "Current version: $CURRENT_VERSION"
          echo "  Version name: $VERSION_NAME"
          echo "  Build number: $BUILD_NUMBER"
          
          # Read stored version from deploy repo tracking file
          VERSION_FILE="$GITHUB_WORKSPACE/.github/deploy/version-android.txt"
          if [ -f "$VERSION_FILE" ]; then
            STORED_BUILD=$(cat "$VERSION_FILE" | tr -d ' \n')
          else
            STORED_BUILD="0"
            echo "ℹ️  Version tracking file not found, initializing to 0"
          fi
          echo "Stored build number: $STORED_BUILD"
          
          # Compare and auto-increment if needed
          NEW_BUILD=$BUILD_NUMBER
          if [ "$BUILD_NUMBER" -le "$STORED_BUILD" ] 2>/dev/null; then
            NEW_BUILD=$((STORED_BUILD + 1))
            NEW_VERSION="${VERSION_NAME}+${NEW_BUILD}"
            echo "⬆️  Auto-incrementing: $CURRENT_VERSION → $NEW_VERSION"
            
            # Update pubspec.yaml using Python (cross-platform)
            python3 -c "
            import re
            with open('enjoychinese_app/pubspec.yaml', 'r') as f:
                content = f.read()
            content = re.sub(r'^version: .*', 'version: $NEW_VERSION', content, flags=re.MULTILINE)
            with open('enjoychinese_app/pubspec.yaml', 'w') as f:
                f.write(content)
            print('✅ Updated pubspec.yaml to version: $NEW_VERSION')
            "
            UPDATED_VERSION="$NEW_VERSION"
          else
            UPDATED_VERSION="$CURRENT_VERSION"
            echo "🔁 Syncing tracking file: pubspec.yaml ($BUILD_NUMBER) > stored ($STORED_BUILD)"
            echo "   → version tracking file will be synced to $BUILD_NUMBER"
          fi
          
          # Update version tracking file in deploy repo
          echo "$NEW_BUILD" > "$VERSION_FILE"
          echo "✅ Updated version tracking file: $NEW_BUILD (previously: $STORED_BUILD)"
          
          # Commit pubspec.yaml changes to Gitee
          echo ""
          echo "=== Committing to Gitee ==="
          git config user.name "jenkins-cicd"
          git config user.email "jenkins@enjoychinese.app"
          git add enjoychinese_app/pubspec.yaml
          
          if git diff --cached --quiet; then
            echo "ℹ️  No pubspec.yaml changes to commit to Gitee"
          else
            git commit -m "chore: auto-increment Android build version to $UPDATED_VERSION [skip ci]"
            REMOTE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/yunhaninfo/enjoy-chinese.git"
            git push "$REMOTE_URL" HEAD:client-release
            echo "✅ Successfully pushed to Gitee"
          fi
          
          # Commit version tracking file to deploy repo (GitHub)
          echo ""
          echo "=== Committing to deploy repo ==="
          cd "$GITHUB_WORKSPACE"
          git config user.name "jenkins-cicd"
          git config user.email "jenkins@enjoychinese.app"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .github/version-android.txt
          
          if git diff --cached --quiet; then
            echo "ℹ️  No tracking file changes to commit to deploy repo"
          else
            git commit -m "chore: update Android build version tracking to $NEW_BUILD [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
            echo "✅ Successfully pushed to deploy repo"
          fi
          
          echo ""
          echo "========================================"
          echo "✅ Version Management Complete: $UPDATED_VERSION"
          echo "========================================"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: 💾 Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ./source-code/enjoychinese_app/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('source-code/enjoychinese_app/pubspec.lock') }}

      - name: 📦 Install Flutter dependencies
        working-directory: ./source-code/enjoychinese_app
        run: flutter pub get

      - name: 🛠️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 35.0.0
          ndk: 26.1.10909125

      - name: 🔑 Decode keystore file
        run: |
          mkdir -p ./source-code/enjoychinese_app/android/app/keys
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ./source-code/enjoychinese_app/android/app/keys/enjoychinese-release.jks

      - name: 📝 Generate key.properties
        working-directory: ./source-code/enjoychinese_app/android
        run: |
          cat > key.properties <<EOF
          # build.gradle.kts 位于 android/app，file() 从 android/app 目录解析路径
          storeFile=./keys/enjoychinese-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: 🔨 Build AAB (Release)
        working-directory: ./source-code/enjoychinese_app
        run: |
          echo "=== Starting Android Release Build ==="
          flutter build appbundle \
            --release \
            --dart-define=ENV=prod \
            --dart-define=PROD_API_HOST=${{ secrets.PROD_API_HOST }} \
            --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          echo ""
          echo "=== Build Completed ==="

      - name: ✅ Verify AAB exists
        working-directory: ./source-code/enjoychinese_app
        run: |
          echo "=== AAB File List ==="
          ls -la build/app/outputs/bundle/release/
          echo ""
          echo "=== File Size ==="
          du -h build/app/outputs/bundle/release/*.aab
          echo ""
          
          AAB_PATH=$(find build/app/outputs/bundle/release -name "app-release.aab" -type f)
          if [ -f "$AAB_PATH" ]; then
            echo "✅ AAB found: $AAB_PATH"
          else
            echo "❌ AAB not found!"
            exit 1
          fi

      - name: 🔍 Verify AAB Permissions (BILLING)
        working-directory: ./source-code/enjoychinese_app
        run: |
          echo "=== Checking AAB Permissions ==="
          AAB_PATH=$(find build/app/outputs/bundle/release -name "app-release.aab" -type f)
          
          echo "Checking $AAB_PATH ..."
          aapt2 dump permissions "$AAB_PATH" > /tmp/aab_permissions.txt
          
          if grep -q "com.android.vending.BILLING" /tmp/aab_permissions.txt; then
            echo "✅ Permission check passed: com.android.vending.BILLING found"
          else
            echo "❌ Permission check FAILED: com.android.vending.BILLING missing"
            echo "Current AAB permissions:"
            cat /tmp/aab_permissions.txt
            exit 1
          fi

      - name: 📦 Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: enjoychinese-prod-aab
          path: ./source-code/enjoychinese_app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 🔑 Decode Google Play Service Account Key
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 -d > /tmp/google-play-key.json

      - name: 📤 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/google-play-key.json
          packageName: com.enjoychinese.app
          releaseFiles: ./source-code/enjoychinese_app/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track }}
          status: completed

      - name: 🧹 Cleanup sensitive files
        if: always()
        run: |
          rm -f ./source-code/enjoychinese_app/android/key.properties
          rm -f ./source-code/enjoychinese_app/android/app/keys/enjoychinese-release.jks
          rm -f /tmp/google-play-key.json
          echo "✅ Cleanup completed"

      - name: 📊 Build Result Report
        run: |
          echo "========================================"
          echo "🎉 Android Release Build Complete"
          echo "========================================"
          echo "Status: ✅ Success"
          echo "Runner: ${{ runner.os }}"
          echo "Flutter: $(flutter --version | head -1)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Track: ${{ github.event.inputs.track }}"
          echo "========================================"
          echo "APK uploaded to Google Play"
          echo "Release Notes: ${{ github.event.inputs.release_notes }}"
          echo "========================================"
          echo "Next Steps:"
          echo "1. Verify build in Google Play Console"
          echo "2. Promote to desired track"
          echo "3. Monitor rollout progress"
          echo "========================================"

  notify:
    needs: build-apk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        if: needs.build-apk.result == 'success'
        run: |
          MESSAGE="✅ Android Production Build Succeeded

          Track: ${{ github.event.inputs.track }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Release Notes: ${{ github.event.inputs.release_notes }}

          View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "$MESSAGE" '{
            msgtype: "text",
            text: { content: $content }
          }' > /tmp/wechat_msg.json
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${{ secrets.WECHAT_WORK_WEBHOOK_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/wechat_msg.json

      - name: Notify failure
        if: needs.build-apk.result == 'failure'
        run: |
          MESSAGE="❌ Android Production Build FAILED

          Track: ${{ github.event.inputs.track }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "$MESSAGE" '{
            msgtype: "text",
            text: { content: $content }
          }' > /tmp/wechat_msg.json
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${{ secrets.WECHAT_WORK_WEBHOOK_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/wechat_msg.json