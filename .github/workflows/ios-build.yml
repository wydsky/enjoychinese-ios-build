name: iOS Build & Sign

on:
  workflow_dispatch: # 手动触发打包
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout 当前打包仓库
        uses: actions/checkout@v4

      # 切换到 Xcode 16.2（解决 Firebase SDK Swift 6.0 兼容问题）
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      # 拉取私有Gitee Flutter代码，账号token从Secrets读取
      - name: Clone Gitee 源码
        run: |
          git clone https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/yunhaninfo/enjoy-chinese.git source-code
          cd source-code

      # 配置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      # 缓存依赖，加快打包速度
      - name: Cache Flutter & Pods
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ./source-code/enjoychinese_app/.dart_tool
            ./source-code/enjoychinese_app/ios/Pods
          key: ${{ runner.os }}-flutter-${{ hashFiles('source-code/enjoychinese_app/pubspec.lock') }}

      # 安装项目依赖
      - name: Flutter pub get
        working-directory: ./source-code/enjoychinese_app
        run: flutter pub get

      # 修复本地 video_player_android 插件缺少 messages.g.dart 的问题
      # CI 环境中该文件未提交到源码，需从 pub.dev 缓存中复制
      - name: Copy messages.g.dart for video_player_android
        working-directory: ./source-code/enjoychinese_app
        run: |
          LOCAL_PLUGIN_DIR="local_plugins/video_player_android/lib/src"
          PUB_CACHE_DIR=$(dirname $(find ~/.pub-cache/hosted/pub.dev -name "video_player_android-*" -type d | head -1))
          if [ -n "$PUB_CACHE_DIR" ] && [ -f "$PUB_CACHE_DIR/video_player_android/lib/src/messages.g.dart" ]; then
            cp "$PUB_CACHE_DIR/video_player_android/lib/src/messages.g.dart" "$LOCAL_PLUGIN_DIR/"
            echo "已从 pub-cache 复制 messages.g.dart"
          else
            echo "警告: 未找到 video_player_android 的 pub-cache 目录"
            ls -la ~/.pub-cache/hosted/pub.dev/ 2>/dev/null | head -20
          fi

      # 安装CocoaPods，避免sudo权限问题
      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Pod install
        working-directory: ./source-code/enjoychinese_app/ios
        run: pod install --repo-update

      # 导入签名证书（发布证书）
      - name: 导入iOS签名证书
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.P12_RELEASE_BASE64 }}
          p12-password: ${{ secrets.P12_RELEASE_PASSWORD }}

      # 导入发布Provisioning Profile到系统目录
      - name: 导入Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROV_RELEASE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/prod_enjoychinese.mobileprovision

      # 生成导出配置（发布模式）
      - name: 生成ExportOptions.plist
        working-directory: ./source-code/enjoychinese_app/ios
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>JU3D9VJFCN</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.enjoychinese.app</key>
              <string>${{ secrets.PROV_RELEASE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # 配置Xcode项目的Development Team和签名方式（解决Runner Release配置缺少DEVELOPMENT_TEAM问题）
      - name: 配置Xcode Team ID
        working-directory: ./source-code/enjoychinese_app/ios
        run: |
          python3 << 'PY'
          team_id = "JU3D9VJFCN"
          path = "Runner.xcodeproj/project.pbxproj"

          with open(path, 'r') as f:
              content = f.read()

          runner_config_ids = [
              "97C147061CF9000F007C117D",  # Debug
              "97C147071CF9000F007C117D",  # Release
              "249021D4217E4FDB00AE95B9",   # Profile
          ]

          def find_block_end(text, start):
              depth = 1
              i = start
              while i < len(text) and depth > 0:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                  i += 1
              return i

          for config_id in runner_config_ids:
              search_str = config_id + " /* "
              start = content.find(search_str)
              while start != -1:
                  brace_start = content.find('{', start)
                  if brace_start == -1:
                      break

                  block_end = find_block_end(content, brace_start + 1)
                  block = content[brace_start:block_end]

                  if 'RunnerTests' in block:
                      start = content.find(search_str, block_end)
                      continue

                  if 'DEVELOPMENT_TEAM' in block:
                      start = content.find(search_str, block_end)
                      continue

                  bs_pos = block.find('buildSettings = {')
                  if bs_pos == -1:
                      start = content.find(search_str, block_end)
                      continue

                  bs_line_end = block.find('\n', bs_pos)
                  if bs_line_end == -1:
                      bs_line_end = bs_pos + len('buildSettings = {')

                  line_before = block[:bs_line_end]
                  indent_len = len(line_before) - len(line_before.lstrip())
                  indent = '\t' * ((indent_len // 4) + 1) if '\t' in line_before else '    ' * ((indent_len // 4) + 1)

                  new_block = block[:bs_line_end] + '\n' + indent + 'DEVELOPMENT_TEAM = ' + team_id + ';\n' + indent + 'CODE_SIGN_STYLE = Manual;' + block[bs_line_end:]
                  content = content[:brace_start] + new_block + content[block_end:]

                  start = content.find(search_str, brace_start + len(new_block))

          with open(path, 'w') as f:
              f.write(content)

          print("已配置 DEVELOPMENT_TEAM 和 CODE_SIGN_STYLE")
          
          with open(path, 'r') as f:
              for i, line in enumerate(f, 1):
                  if 'DEVELOPMENT_TEAM' in line or 'CODE_SIGN_STYLE' in line:
                      print(f"第{i}行: {line.strip()}")
          PY

      # 编译签名IPA
      - name: Build IPA
        working-directory: ./source-code/enjoychinese_app
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --dart-define=ENV=prod \
            --dart-define=PROD_API_HOST=${{ secrets.PROD_API_HOST }} \
            --export-options-plist=ios/ExportOptions.plist

      # 上传打包产物，可下载
      - name: 上传IPA安装包
        uses: actions/upload-artifact@v4
        with:
          name: enjoychinese-prod-ipa
          path: ./source-code/enjoychinese_app/build/ios/ipa/*.ipa