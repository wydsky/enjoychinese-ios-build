name: EnjoyChinese iOS Simulator Build

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-26
    name: 生成EnjoyChinese模拟器.app
    permissions:
      contents: read
    steps:
      - name: 📋 Checkout 当前打包仓库
        uses: actions/checkout@v4

      - name: 🛠️ 自动检测并选择最新可用的 Xcode 版本
        run: |
          echo "=== 可用的 Xcode 版本 ==="
          find /Applications -maxdepth 1 -type d -name "Xcode*.app" | sort -V
          echo ""
          
          AVAILABLE_XCODE=$(find /Applications -maxdepth 1 -type d -name "Xcode*.app" | sort -V | tail -1)
          if [ -n "$AVAILABLE_XCODE" ]; then
            echo "选择最新 Xcode: $AVAILABLE_XCODE"
            sudo xcode-select -s "$AVAILABLE_XCODE/Contents/Developer"
          else
            echo "警告: 未找到 Xcode，使用默认配置"
          fi
          
          echo ""
          echo "=== 当前 Xcode 版本 ==="
          xcodebuild -version

      - name: 📥 拉取私有Gitee Flutter代码
        run: |
          git clone -b client-release https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/yunhaninfo/enjoy-chinese.git source-code
          cd source-code

      - name: 🚀 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: 💾 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ./source-code/enjoychinese_app/.dart_tool
            ./source-code/enjoychinese_app/ios/Pods
          key: ${{ runner.os }}-enjoychinese-flutter-${{ hashFiles('source-code/enjoychinese_app/pubspec.lock') }}

      - name: 📦 安装项目依赖
        working-directory: ./source-code/enjoychinese_app
        run: flutter pub get

      - name: 📦 安装 CocoaPods
        run: brew install cocoapods

      - name: 📦 Pod install
        working-directory: ./source-code/enjoychinese_app/ios
        run: pod install --repo-update

      - name: 🔨 构建模拟器版本
        working-directory: ./source-code/enjoychinese_app
        run: |
          echo "=== 开始构建模拟器版本 ==="
          flutter build ios \
            --debug \
            --simulator \
            --no-codesign \
            --dart-define=ENV=prod \
            --dart-define=PROD_API_HOST=https://app.enjoychinese.app
          echo ""
          echo "=== 构建完成 ==="

      - name: ✅ 验证构建产物
        working-directory: ./source-code/enjoychinese_app
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          
          if [ -d "$APP_PATH" ]; then
            echo "✅ 构建成功！"
            echo "产物路径: $APP_PATH"
            echo "文件大小: $(du -sh "$APP_PATH")"
            echo ""
            echo "=== 文件列表 ==="
            ls -la "$APP_PATH" | head -20
          else
            echo "❌ 构建失败：未找到 Runner.app"
            exit 1
          fi

      - name: 📤 上传模拟器构建产物
        uses: actions/upload-artifact@v4
        with:
          name: enjoychinese-simulator-app
          path: |
            ./source-code/enjoychinese_app/build/ios/**/*.app
          if-no-files-found: error

      - name: 📊 构建结果报告
        run: |
          echo "========================================"
          echo "🎉 iOS Simulator Build 完成"
          echo "========================================"
          echo "状态: ✅ 成功"
          echo "Runner: ${{ runner.os }}"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Flutter: $(flutter --version | head -1)"
          echo "========================================"
          echo "下一步：下载 enjoychinese-simulator-app 产物"
          echo "在本地 iOS 模拟器中进行测试验证"
          echo "测试通过后手动触发 iOS Release Build"
          echo "========================================"

          

  # ============================================================
  # 企业微信通知：成功 / 失败都推送，与其他构建 workflow 保持一致。
  # Webhook key 来自 Secrets.WECHAT_WORK_WEBHOOK_KEY；未配置时仅通知缺失，不影响构建结果。
  # ============================================================
  notify:
    needs: build-simulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        if: needs.build-simulator.result == 'success'
        run: |
          MESSAGE="✅ EnjoyChinese iOS 模拟器包 构建成功

          App: com.enjoychinese.app
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          View: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "$MESSAGE" '{
            msgtype: "text",
            text: { content: $content }
          }' > /tmp/wechat_msg.json
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${{ secrets.WECHAT_WORK_WEBHOOK_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/wechat_msg.json

      - name: Notify failure
        if: needs.build-simulator.result == 'failure'
        run: |
          MESSAGE="❌ EnjoyChinese iOS 模拟器包 构建失败

          App: com.enjoychinese.app
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg content "$MESSAGE" '{
            msgtype: "text",
            text: { content: $content }
          }' > /tmp/wechat_msg.json
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${{ secrets.WECHAT_WORK_WEBHOOK_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/wechat_msg.json