name: EnjoyCards Windows Portable Build (官网下载 · Inno Setup 安装包)

# 用途：构建 EnjoyCards Windows 桌面版，用 Inno Setup 打包成「带安装向导的安装包」并作为
# Artifact 提供下载。该安装包由你下载后手动上传到官网/发布服务器，并在后端登记版本
# （app_version 表 package_name = com.enjoycards.app.windows），官网的 /js/download.js
# 会据此展示版本、文件大小与 SHA-256。
#
# 与 enjoycards-windows-build.yml 的分工：
#   - 本文件          → 官网直接下载用的 Inno Setup 安装包（安装向导/快捷方式/卸载入口）
#   - enjoycards-windows-build.yml → Microsoft Store 上架用的 MSIX
# 两者共用同一份 Flutter 代码，但各自维护独立的版本 tracking 文件（互不干扰）。

on:
  workflow_dispatch:

# 与 Store 版 workflow 共用同一串行组：两者都会自增并推送同一分支的 pubspec.yaml，
# 并发手动触发会产生 non-fast-forward 冲突，这里让它们排队执行。
concurrency:
  group: enjoycards-windows-build
  cancel-in-progress: false

jobs:
  build-windows-portable:
    runs-on: windows-latest
    name: 构建EnjoyCards Windows便携版（Inno Setup 安装包，供官网下载）
    permissions:
      contents: write
    steps:
      - name: 📋 Checkout 当前打包仓库
        uses: actions/checkout@v4

      - name: 📥 拉取私有Gitee Flutter代码
        shell: bash
        run: |
          git clone -b client-release https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/yunhaninfo/enjoy-chinese.git source-code
          cd source-code

      - name: 🔢 Manage Windows Portable Build Version
        working-directory: ./source-code
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "🔢 Managing EnjoyCards Windows Portable Build Version"
          echo "========================================"

          CURRENT_VERSION=$(grep "^version:" enjoycards_app/pubspec.yaml | sed 's/version: *//' | tr -d ' ')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d+ -f2)
          echo "Current version: $CURRENT_VERSION"
          echo "  Version name: $VERSION_NAME"
          echo "  Build number: $BUILD_NUMBER"

          VERSION_TRACK_FILE=".github/deploy/version-enjoycards-windows-portable.txt"
          VERSION_FILE="$GITHUB_WORKSPACE/$VERSION_TRACK_FILE"
          if [ -f "$VERSION_FILE" ]; then
            STORED_BUILD=$(cat "$VERSION_FILE" | tr -d ' \n')
          else
            STORED_BUILD="0"
            echo "ℹ️  Version tracking file not found, initializing to 0"
          fi
          echo "Stored build number: $STORED_BUILD"

          NEW_BUILD=$BUILD_NUMBER
          if [ "$BUILD_NUMBER" -le "$STORED_BUILD" ] 2>/dev/null; then
            NEW_BUILD=$((STORED_BUILD + 1))
            NEW_VERSION="${VERSION_NAME}+${NEW_BUILD}"
            echo "⬆️  Auto-incrementing: $CURRENT_VERSION → $NEW_VERSION"
            sed -i "s/^version: .*/version: ${NEW_VERSION}/" enjoycards_app/pubspec.yaml
            echo "✅ Updated pubspec.yaml to version: $NEW_VERSION"
            UPDATED_VERSION="$NEW_VERSION"
          else
            UPDATED_VERSION="$CURRENT_VERSION"
            echo "🔁 Syncing tracking file: pubspec.yaml ($BUILD_NUMBER) > stored ($STORED_BUILD)"
          fi

          mkdir -p "$(dirname "$VERSION_FILE")"
          echo "$NEW_BUILD" > "$VERSION_FILE"
          echo "✅ Updated version tracking file: $NEW_BUILD (previously: $STORED_BUILD)"

          echo ""
          echo "=== Committing to Gitee ==="
          git config user.name "jenkins-cicd"
          git config user.email "jenkins@enjoychinese.app"
          git add enjoycards_app/pubspec.yaml
          if git diff --cached --quiet; then
            echo "ℹ️  No pubspec.yaml changes to commit to Gitee"
          else
            git commit -m "chore: auto-increment EnjoyCards Windows portable build version to $UPDATED_VERSION [skip ci]"
            REMOTE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/yunhaninfo/enjoy-chinese.git"
            git push "$REMOTE_URL" HEAD:client-release
            echo "✅ Successfully pushed to Gitee"
          fi

          echo ""
          echo "=== Committing to deploy repo ==="
          COMMIT_MSG="chore: update EnjoyCards Windows portable build version tracking to $NEW_BUILD [skip ci]"
          ENCODED_CONTENT=$(echo -n "$NEW_BUILD" | base64 -w 0)
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${VERSION_TRACK_FILE}"
          HTTP_CODE=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            # 用 jq 取 sha：本步骤下方已依赖 jq，避免额外引入 python3（windows runner 上只有 python）
            FILE_SHA=$(jq -r '.sha' /tmp/api_response.json)
            JSON_BODY=$(jq -n \
              --arg msg "$COMMIT_MSG" \
              --arg content "$ENCODED_CONTENT" \
              --arg sha "$FILE_SHA" \
              '{message: $msg, content: $content, sha: $sha}')
          else
            JSON_BODY=$(jq -n \
              --arg msg "$COMMIT_MSG" \
              --arg content "$ENCODED_CONTENT" \
              '{message: $msg, content: $content}')
          fi
          UPDATE_CODE=$(curl -s -o /tmp/update_response.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$JSON_BODY" \
            "$API_URL")
          if [ "$UPDATE_CODE" = "200" ] || [ "$UPDATE_CODE" = "201" ]; then
            echo "✅ Successfully updated deploy repo via GitHub API"
          else
            echo "❌ Failed to update deploy repo (HTTP $UPDATE_CODE)"
            cat /tmp/update_response.json
            exit 1
          fi
          echo "========================================"
          echo "✅ Version Management Complete: $UPDATED_VERSION"
          echo "========================================"
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: 🚀 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: 💾 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Pub/Cache
            ./source-code/enjoycards_app/.dart_tool
            ./source-code/enjoycards_app/build/windows
          key: ${{ runner.os }}-enjoycards-windows-portable-flutter-${{ hashFiles('source-code/enjoycards_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-enjoycards-windows-portable-flutter-

      - name: 📦 安装项目依赖
        working-directory: ./source-code/enjoycards_app
        run: flutter pub get

      - name: 🏗️ 生成代码（json_serializable等）
        working-directory: ./source-code/enjoycards_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 编译 Windows Release
        working-directory: ./source-code/enjoycards_app
        shell: bash
        run: |
          echo "=== 开始构建 EnjoyCards Windows 桌面版 ==="
          # 说明：不注入 REVENUECAT_API_KEY —— RevenueCat 在 Windows 上未启用
          # （见 lib/services/revenuecat_service.dart: Platform.isIOS/MacOS/Android 之外直接 return）
          flutter build windows \
            --release \
            --dart-define=ENV=prod \
            --dart-define=PROD_API_HOST=${{ secrets.PROD_API_HOST }}
          echo ""
          echo "=== Windows 构建完成 ==="

      - name: ✅ 校验产物（定位 Release 目录）
        id: locate
        working-directory: ./source-code/enjoycards_app
        shell: pwsh
        run: |
          # Flutter 3.10+ 输出在 build/windows/x64/runner/Release；旧版在 build/windows/runner/Release。
          # 这里按文件名反查，避免因 Flutter 版本差异导致路径写死而失败。
          $exe = Get-ChildItem -Path 'build/windows' -Recurse -Filter 'enjoycards_app.exe' -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.DirectoryName -match 'Release' } |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Host "❌ 未找到 enjoycards_app.exe，build/windows 目录内容："
            if (Test-Path 'build/windows') { Get-ChildItem -Path 'build/windows' -Recurse -Depth 3 | Select-Object FullName }
            exit 1
          }
          $releaseDir = $exe.DirectoryName
          Write-Host "✅ Release 目录: $releaseDir"
          Write-Host "=== 目录内容（前 40 项）==="
          Get-ChildItem -Path $releaseDir | Select-Object -First 40 Name, Length
          Write-Host "=== 目录总大小 ==="
          $sizeMb = [math]::Round(((Get-ChildItem $releaseDir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "$sizeMb MB"

          # 关键文件必须在，否则用户下载后无法运行
          foreach ($required in @('enjoycards_app.exe', 'flutter_windows.dll', 'data')) {
            if (Test-Path (Join-Path $releaseDir $required)) {
              Write-Host "✅ 包含 $required"
            } else {
              Write-Host "❌ 缺少 $required —— 打包后会无法运行"
              exit 1
            }
          }

          "release_dir=$releaseDir" >> $env:GITHUB_OUTPUT

      - name: 📦 打包为安装包（Inno Setup）
        id: package
        working-directory: ./source-code/enjoycards_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseDir = '${{ steps.locate.outputs.release_dir }}'
          $versionName = (Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(.+)' |
                          Select-Object -First 1).Matches[0].Groups[1].Value.Trim() -replace '\+', '.'
          Write-Host "打包版本: $versionName"

          $outDir = Join-Path (Get-Location) 'build/windows/site'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeName = "EnjoyCards-Setup-$versionName.exe"
          $outExe  = Join-Path $outDir $exeName
          $issPath = Join-Path $outDir 'enjoycards.iss'

          # 1) 定位 Inno Setup 编译器（runner 镜像预装；先查 PATH 再查默认安装目录，最后 choco 兜底）
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in @(
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 5\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe"
            )) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc -and (Test-Path 'C:\ProgramData\chocolatey\lib')) {
            $iscc = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter 'ISCC.exe' -File -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw '未找到 ISCC.exe（Inno Setup 编译器），无法生成安装包' }
          Write-Host "ISCC: $iscc"

          # 2) 生成 Inno Setup 脚本（安装向导 / 目录选择 / 快捷方式 / 卸载入口 / 装完可自动运行）
          #    脚本在 CI 内动态生成、不落地到 Flutter 仓库；内容保持纯 ASCII，避免编码问题。
          $iconPath = Join-Path (Get-Location) 'windows/runner/resources/app_icon.ico'
          $iconLine = if (Test-Path $iconPath) { "SetupIconFile=$iconPath" } else { '' }
          $islPath  = Join-Path (Split-Path $iscc) 'Languages\ChineseSimplified.isl'
          $cnLine   = if (Test-Path $islPath) { 'Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"' } else { '' }
          $outputBase = $exeName -replace '\.exe$', ''

          $issLines = @(
            '; generated by CI - do not edit by hand'
            '[Setup]'
            'AppId={{8F1D2A54-3C6B-4E7A-9D21-5B0C7E3A1F42}'
            'AppName=EnjoyCards'
            "AppVersion=$versionName"
            'AppPublisher=EnjoyCards'
            'DefaultDirName={autopf}\EnjoyCards'
            'DefaultGroupName=EnjoyCards'
            'DisableProgramGroupPage=yes'
            'AllowNoIcons=yes'
            'PrivilegesRequired=lowest'
            'ArchitecturesInstallIn64BitMode=x64'
            'Compression=lzma2/max'
            'SolidCompression=yes'
            'WizardStyle=modern'
            'UninstallDisplayName=EnjoyCards'
            'UninstallDisplayIcon={app}\enjoycards_app.exe'
            "OutputDir=$outDir"
            "OutputBaseFilename=$outputBase"
          )
          if ($iconLine) { $issLines += $iconLine }
          $issLines += @(
            ''
            '[Languages]'
            'Name: "english"; MessagesFile: "compiler:Default.isl"'
          )
          if ($cnLine) { $issLines += $cnLine }
          $issLines += @(
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: checkedonce'
            ''
            '[Files]'
            "Source: `"$releaseDir\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs"
            ''
            '[Icons]'
            'Name: "{autoprograms}\EnjoyCards"; Filename: "{app}\enjoycards_app.exe"'
            'Name: "{autodesktop}\EnjoyCards"; Filename: "{app}\enjoycards_app.exe"; Tasks: desktopicon'
            ''
            '[Run]'
            'Filename: "{app}\enjoycards_app.exe"; Description: "{cm:LaunchProgram,EnjoyCards}"; Flags: nowait postinstall skipifsilent'
          )
          [System.IO.File]::WriteAllLines($issPath, $issLines, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host "Inno Setup 脚本: $issPath"

          # 3) 剔除调试符号，减小体积
          Get-ChildItem -Path $releaseDir -Recurse -Include '*.pdb' -File | Remove-Item -Force -ErrorAction SilentlyContinue

          # 4) 编译安装包（ISCC 按脚本把 Release 目录整体打进安装包）
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败，退出码 $LASTEXITCODE" }
          if (-not (Test-Path $outExe)) { throw "未生成安装包: $outExe" }

          $exeSize = (Get-Item $outExe).Length
          Write-Host "✅ 已生成安装包: $outExe ($([math]::Round($exeSize / 1MB, 1)) MB)"

          # 5) 生成 SHA-256 校验文件（官网展示的 checksum 用这个值登记）
          $hash = (Get-FileHash -Algorithm SHA256 $outExe).Hash.ToLower()
          Set-Content -Path "$outExe.sha256" -Value "$hash  $exeName" -Encoding ascii -NoNewline
          Write-Host "✅ SHA-256: $hash"

          "version=$versionName" >> $env:GITHUB_OUTPUT
          "exe_name=$exeName"     >> $env:GITHUB_OUTPUT
          "exe_size=$exeSize"     >> $env:GITHUB_OUTPUT
          "sha256=$hash"          >> $env:GITHUB_OUTPUT

      - name: 📦 上传Artifact（供下载后手动上传到官网）
        uses: actions/upload-artifact@v4
        with:
          name: enjoycards-prod-windows-portable
          path: ./source-code/enjoycards_app/build/windows/site/EnjoyCards-Setup-*.exe*
          if-no-files-found: error
          retention-days: 90

      - name: 📊 构建结果报告
        id: report
        shell: bash
        run: |
          echo "========================================"
          echo "🎉 EnjoyCards Windows 便携版（Inno Setup 安装包）构建完成"
          echo "========================================"
          echo "状态: ✅ 成功"
          echo "Runner: ${{ runner.os }}"
          echo "Flutter: $(flutter --version | head -1)"
          echo ""
          echo "版本:      ${{ steps.package.outputs.version }}"
          echo "文件名:    ${{ steps.package.outputs.exe_name }}"
          echo "文件大小:  ${{ steps.package.outputs.exe_size }} 字节"
          echo "SHA-256:   ${{ steps.package.outputs.sha256 }}"
          echo ""
          echo "Artifact: enjoycards-prod-windows-portable"
          echo "========================================"
          echo "后续手工步骤："
          echo "1. 下载 Artifact 中的 EnjoyCards-Setup-<version>.exe"
          echo "2. 上传到官网发布服务器 / CDN"
          echo "3. 在后端登记版本（package_name = com.enjoycards.app.windows），"
          echo "   填入上面的文件名、大小与 SHA-256"
          echo "4. 打开 https://www.enjoycards.app/en/download/ 确认按钮变为可下载状态"
          echo "========================================"